<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دعوة زواج</title>

<!-- خط جميل -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Cairo',sans-serif;
background: radial-gradient(circle at center, #1a1a1a, #000);
color:white;
direction:rtl;
overflow:hidden;
}

/* خلفية رومانسية */
body::before{
content:"";
position:fixed;
width:200%;
height:200%;
background: radial-gradient(circle, rgba(255,215,0,0.2), transparent 70%);
animation:bgmove 10s infinite alternate;
}

@keyframes bgmove{
0%{transform:translate(0,0)}
100%{transform:translate(-40px,40px)}
}

/* الصفحات */
.page{
position:absolute;
width:100%;
height:100%;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
padding:20px;
text-align:center;
}

.active{
display:flex;
animation:fade 1.2s;
}

@keyframes fade{
from{opacity:0;transform:translateY(30px)}
to{opacity:1}
}

/* النص */
.invite{
max-width:700px;
line-height:2;
font-size:18px;
}

/* زر */
button{
padding:12px 25px;
margin:10px;
border:none;
border-radius:30px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.08);
}

.gold{background:gold;color:black}
.dark{background:#222;color:white}

/* إدخال */
input, textarea{
padding:10px;
margin:10px;
border:none;
border-radius:10px;
width:230px;
}

/* تهاني */
#board{
margin-top:20px;
max-height:250px;
overflow:auto;
}

/* الرسائل */
.msg{
background:rgba(255,255,255,0.05);
padding:10px;
margin:5px;
border-radius:10px;
animation:fadeIn 0.7s;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(10px)}
to{opacity:1}
}

</style>
</head>

<body>

<!-- 🎵 موسيقى -->
<iframe width="0" height="0"
src="https://www.youtube.com/embed/YCJET0fGGDU?autoplay=1&loop=1&playlist=YCJET0fGGDU"
frameborder="0" allow="autoplay">
</iframe>

<!-- الصفحة 1 -->
<div class="page active" id="p1">

<div class="invite" id="text"></div>

<button class="gold" onclick="go('p1','p2')">تم</button>

</div>

<!-- الصفحة 2 -->
<div class="page" id="p2">

<h2>اكتب تهنئتك 🎉</h2>

<input id="username" placeholder="اسمك">
<textarea id="msg" placeholder="اكتب تهنئة..."></textarea>

<button class="gold" onclick="send()">إرسال</button>

<div id="board"></div>

<button class="dark" onclick="go('p2','p3')">التالي</button>

</div>

<!-- الصفحة 3 -->
<div class="page" id="p3">

<h2>هل ستحضر؟</h2>

<button class="gold" onclick="alert('✅ تم تسجيل حضورك')">✅ تأكيد الحضور</button>
<button class="dark" onclick="alert('💔 تم تسجيل اعتذارك')">❌ اعتذار</button>

</div>

<script type="module">

/* Firebase */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onValue } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAlplPiUX8muKNGZ2ib7E1qfK49_fVSkb4",
  authDomain: "inve-b08fb.firebaseapp.com",
  projectId: "inve-b08fb",
  storageBucket: "inve-b08fb.firebasestorage.app",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* نص يظهر حرف حرف */
let text = `
بسم الله الرحمن الرحيم

"وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَاجًا
لِّتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً"

يتشرف محمود و لانا بدعوتكم لمشاركتنا فرحتنا
وذلك يوم ذاك اليوم الموافق [التاريخ الهجري]
في قاعة هاذيك القاعة الي هناك

حضوركم هو تمام الفرح والسرور
`;
let i=0;

function typeWriter(){
if(i < text.length){
document.getElementById("text").innerHTML += text.charAt(i);
i++;
setTimeout(typeWriter,35);
}
}
typeWriter();

/* التنقل */
window.go = function(a,b){
document.getElementById(a).classList.remove("active");
document.getElementById(b).classList.add("active");
}

/* إرسال تهنئة */
window.send = function(){

let name = document.getElementById("username").value;
let msg = document.getElementById("msg").value;

if(name=="" || msg==""){
alert("اكتب اسمك وتهنئتك");
return;
}

/* حفظ */
push(ref(db,"messages"),{
name:name,
text:msg
});

/* إرسال ايميل */
fetch("https://formsubmit.co/ajax/mohandbadr89.m@gmail.com", {
method:"POST",
headers:{'Content-Type':'application/json'},
body: JSON.stringify({
name:name,
message:msg
})
});

}

/* عرض التهاني */
onValue(ref(db,"messages"),snapshot=>{

let data = snapshot.val();
let html="";

for(let id in data){
html += `
<div class="msg">
<strong>${data[id].name}</strong> 💐<br>
${data[id].text}
</div>`;
}

document.getElementById("board").innerHTML = html;

});

</script>

</body>
</html>
